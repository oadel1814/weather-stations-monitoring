version: '3.8'
services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - elasticnet

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.11.1
    container_name: elasticsearch
    ports:
      - '9200:9200'
      - '9300:9300'
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xmx512m -Xms512m
      node.name: crud-node
      cluster.name: weather-stations-monitoring
    volumes:
      - ./elastic/data:/usr/share/elasticsearch/data
    networks:
      - elasticnet

  kibana:
    image: docker.elastic.co/kibana/kibana:7.11.1
    container_name: kibana
    ports:
      - '5601:5601'
      - '9600:9600'
    environment:
      SERVERNAME: kibana
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ES_JAVA_OPTS: -Xmx512m -Xms512m
    networks:
      - elasticnet
    depends_on:
      - elasticsearch

  central-station:
    build:
      context: .
      dockerfile: ./central-station/Dockerfile
    container_name: central-station
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092
      - JAVA_TOOL_OPTIONS=-Djava.security.manager=allow
      - BITCASK_DIR=/data/bitcask
      - PARQUET_DIR=/data/parquet
    volumes:
      - ./parquet-data:/data/parquet
      - ./bitcask-data:/data/bitcask
    networks:
      - elasticnet


  weather-station-1:
    build:
      context: ./weather-station
    container_name: weather-station-1
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092
      - STATION_ID=1
    networks:
      - elasticnet

  weather-station-2:
    build:
      context: ./weather-station
    container_name: weather-station-2
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092
      - STATION_ID=2
    networks:
      - elasticnet

  weather-station-3:
    build:
      context: ./weather-station
    container_name: weather-station-3
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092
      - STATION_ID=3
    networks:
      - elasticnet

  weather-station-4:
    build:
      context: ./weather-station
    container_name: weather-station-4
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092
      - STATION_ID=4
    networks:
      - elasticnet

  weather-station-api:
    build:
      context: ./weather-station
    container_name: weather-station-api
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092
      - MAIN_CLASS=com.data_aquisition.producer.OpenMeteoChannelAdaptor
    networks:
      - elasticnet


  es-worker:
    build:
      context: ./es-worker
    container_name: es-worker
    depends_on:
      - elasticsearch
      - central-station
    environment:
      - ES_URL=http://elasticsearch:9200/_bulk
      - PARQUET_DIR=/data/parquet
      - POLL_INTERVAL=360
    volumes:
      - ./parquet-data:/data/parquet
    networks:
      - elasticnet

volumes:
  logvolume01: {}

networks:
  elasticnet: {}