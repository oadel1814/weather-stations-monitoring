apiVersion: v1
kind: Service
metadata:
  name: weather-station
spec:
  clusterIP: None
  selector:
    app: weather-station
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weather-station
spec:
  serviceName: "weather-station"
  replicas: 5
  selector:
    matchLabels:
      app: weather-station
  template:
    metadata:
      labels:
        app: weather-station
    spec:
      containers:
        - name: weather-station
          image: muhammedatef14/weather-station:v2
          imagePullPolicy: Always
          env:
            - name: KAFKA_BROKER
              value: "kafka:29092"
            - name: STATION_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name